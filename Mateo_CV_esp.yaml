          - "[Repo Frontend](https://github.com/Tomilomi/chat-collab-react): **React, Tailwind**"

      - name: "[Pokémon TCG](https://pokemon-tcg-g8-1.onrender.com/welcome)"
        date:
        start_date:
        end_date:
        location:
        summary: Versión digital del Juego de Cartas Coleccionables de Pokémon desarrollada como proyecto universitario para la UTN. Backend en Spring Boot con Java 21 y frontend en Angular. Cuenta con un motor de juego personalizado que maneja turnos, ataques, cálculo de daño, condiciones especiales y condiciones de victoria. La sincronización multijugador en tiempo real se realiza mediante WebSocket, con PostgreSQL para la persistencia, Flyway para las migraciones de base de datos y Docker Compose para la infraestructura contenerizada.
        highlights:
          - "[Live](https://pokemon-tcg-g8-1.onrender.com/welcome): **Java 21, Spring Boot, WebSocket, PostgreSQL, Flyway, Docker Compose**"
          - "Frontend: **Angular, Typescript**"

