cv:
  name: Mateo Del Lungo
  headline:
  location: Cordoba, Argentina
  email: mateodellungo@gmail.com
  photo:
  phone: +54-351-7536490
  website:
  social_networks:
    - network: LinkedIn
      username: mateo-del-lungo
    - network: GitHub
      username: Mudo0
  custom_connections:
  sections:
    summary:
      - Software Development student with a strong focus on backend. I really like solving problems, creating systems and learning about new technologies.
      - Engaging in diverse personal projects has allowed me to sharpen my technical skills across different enviroments.
      - Currently i'm seeking job opportunities to apply my skills while continuing to learn and grow as a professional developer.
    skills:
      - label: Programming Languages
        details: C#, Java, Javascript, Typescript
      - label: Databases
        details: SQL Server, PostgreSQL, MongoDB
      - label: Technologies
        details: .NET, Angular, Spring, Maven, HTML, CSS, Tailwind, Bootstrap
      - label: Tools
        details: Git, Linux, Docker (learning)
    projects:
      - name: "Full-stack Online Multiplayer Board Game (El Estanciero) "
        date:
        start_date:
        end_date:
        location:
        summary: Collaborative development of a digital version of "El Estanciero", featuring real-time gameplay, user authentication, complex bussiness logic, and persistent game states. I was involved in both the frontend and backend development.
        highlights:
          - "[Backend Repo](https://github.com/Grupo-Prog/Proyecto-EstancieroWebApp-Backend): RESTful API in Java, Spring Boot, SQL Server, JWT auth"
          - "[Frontend Repo](https://github.com/Grupo-Prog/Proyecto-EstancieroWebApp-Frontend): Angular, Typescript, Tailwind"
          - "Architecture: Repositories, Services, Models, Handlers"
      - name: "Full-stack Real-Time Chat Application"
        date:
        start_date:
        end_date:
        location:
        summary: Developed a scalable real-time messaging platform in a collaborative environment using SignalR for low-latency, bi-directional communication. I was involved in both the frontend and backend development.
        highlights:
          - "[Backend Repo](https://github.com/Tomilomi/chat-in-realtime-collab): C#, SignalR, Websockets, PostgreSQL, ASP.NET Core"
          - "[Frontend Repo](https://github.com/Tomilomi/chat-collab-react): React, Tailwind"
    education:
      - institution: National Technological University (UTN)
        area: Software development
        degree: Higher Technician
        date:
        start_date:
        end_date:
        location:
        summary:
        highlights:
